# GitHub Actions CI Pipeline for Portfolio GNN Optimizer
# Validates Phase 1-3: Core Infrastructure, Data Ingestion, Graph Construction
#
# Triggers: push, pull_request
# Matrix: Python 3.10, 3.11 on ubuntu-latest
# Guarantees: CPU-only, no network calls in tests, deterministic execution

name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python with specified version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      # Step 4: Upgrade pip to latest version
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
          pip --version

      # Step 5: Install package in editable mode
      - name: Install package (editable)
        run: |
          pip install -e .
          echo "Package installed successfully"

      # Step 6: Verify core imports work
      - name: Verify imports
        run: |
          echo "=== Phase 1: Core Infrastructure ==="
          python -c "from portfolio_gnn.core.config import load_config; print('✓ config')"
          python -c "from portfolio_gnn.core.seeding import set_global_seed; print('✓ seeding')"
          python -c "from portfolio_gnn.core.logging import setup_logging; print('✓ logging')"
          python -c "from portfolio_gnn.core.paths import ProjectPaths; print('✓ paths')"
          
          echo "=== Phase 2: Data Ingestion ==="
          python -c "from portfolio_gnn.data.loader import DataLoader; print('✓ loader')"
          python -c "from portfolio_gnn.data.preprocessing import DataPreprocessor; print('✓ preprocessing')"
          python -c "from portfolio_gnn.data.validation import DataValidator; print('✓ validation')"
          
          echo "=== Phase 3: Graph Construction ==="
          python -c "from portfolio_gnn.graph.nodes import NodeRegistry; print('✓ nodes')"
          python -c "from portfolio_gnn.graph.edges import RollingCorrelationEdgeBuilder; print('✓ edges')"
          python -c "from portfolio_gnn.graph.graph_builder import GraphBuilder; print('✓ graph_builder')"
          python -c "from portfolio_gnn.graph.validation import GraphValidator; print('✓ graph validation')"
          
          echo "=== All imports verified ==="

      # Step 7: Run full test suite with pytest
      - name: Run pytest
        run: |
          pip install pytest pytest-cov
          pytest -v --tb=short --strict-markers
        env:
          PGNN_RUNTIME_SEED: "42"

      # Step 8: Smoke test - run full pipeline
      - name: Run smoke test (full pipeline)
        run: |
          echo "=== Running full pipeline smoke test ==="
          python scripts/run.py experiments/base.yaml
          echo "=== Smoke test completed ==="
        env:
          PGNN_RUNTIME_SEED: "42"
          PGNN_RUNTIME_LEVEL: "WARNING"
