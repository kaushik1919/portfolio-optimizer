# Portfolio GNN Base Experiment Configuration
# ============================================
# This is the foundational configuration template for all experiments.
# All required sections are present with placeholder values.
#
# Environment variable substitution is supported:
#   ${VAR}           - replaced with environment variable VAR
#   ${VAR:-default}  - replaced with VAR or 'default' if VAR is not set
#
# Environment variable overrides:
#   PGNN_SECTION_KEY=value overrides config.section.key
#   Example: PGNN_RUNTIME_SEED=123 overrides runtime.seed

# =============================================================================
# DATA CONFIGURATION
# =============================================================================
# Configuration for data ingestion, preprocessing, and validation.
# All ingestion behavior is config-driven with strict guarantees.
data:
  # Date range for data loading (REQUIRED)
  # Format: YYYY-MM-DD
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  
  # Asset universe - list of ticker symbols to load from Yahoo Finance
  # These should be liquid US equities/ETFs with sufficient history
  asset_universe:
    - "SPY"   # S&P 500 ETF
    - "QQQ"   # Nasdaq 100 ETF
    - "IWM"   # Russell 2000 ETF
    - "AAPL"  # Apple
    - "MSFT"  # Microsoft
    - "GOOGL" # Alphabet
    - "AMZN"  # Amazon
    - "META"  # Meta
    - "NVDA"  # Nvidia
    - "JPM"   # JPMorgan
    - "JNJ"   # Johnson & Johnson
    - "V"     # Visa
    - "PG"    # Procter & Gamble
    - "UNH"   # UnitedHealth
    - "HD"    # Home Depot
    - "MA"    # Mastercard
    - "DIS"   # Disney
    - "PYPL"  # PayPal
    - "ADBE"  # Adobe
    - "NFLX"  # Netflix
  
  # Macro series - FRED series IDs for macroeconomic factors (optional)
  # These are used for regime detection and risk factors
  macro_series:
    - "DGS10"     # 10-Year Treasury Rate
    - "DGS2"      # 2-Year Treasury Rate
    - "T10Y2Y"    # 10Y-2Y Spread (yield curve)
    - "VIXCLS"    # VIX Volatility Index
    - "DFF"       # Federal Funds Rate
  
  # Data quality parameters (CRITICAL for quant integrity)
  # Minimum trading days required per asset
  min_history_days: 252  # ~1 year of trading days
  
  # Maximum allowed missing data ratio per asset (0.0 to 1.0)
  # Assets exceeding this threshold are dropped
  max_missing_ratio: 0.05  # 5% maximum missing
  
  # Data source configuration
  source:
    type: "yahoo"  # Primary source for equity prices
    fred_api_key: "${FRED_API_KEY:-}"  # Optional FRED API key
  
  # Preprocessing settings (Phase 2)
  preprocessing:
    # NO forward-fill or backward-fill (quant requirement)
    fill_missing: "none"
    # Minimum history after alignment
    min_history_days: 252

# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
# Configuration for the Graph Neural Network architecture.
# Phase 4+ will implement GNN models based on these settings.
model:
  # GNN architecture type
  architecture:
    type: "placeholder"  # e.g., "GAT", "GCN", "GraphSAGE"
    num_layers: 3
    hidden_dim: 128
    output_dim: 64
  
  # Attention mechanism (for GAT-based models)
  attention:
    num_heads: 4
    dropout: 0.1

# =============================================================================
# GRAPH CONSTRUCTION CONFIGURATION (Phase 3)
# =============================================================================
# Configuration for time-aware financial graph construction.
# These parameters control how cross-asset relationships are encoded.
#
# CRITICAL: All graph computations are causal (no lookahead bias).
# Edge correlations use ONLY data within [t-lookback_window, t].
graph:
  # Lookback window for rolling edge computations (in trading days)
  # Correlation is computed over this window ending at each timestamp.
  # Higher values = smoother but slower to adapt
  # Lower values = more responsive but noisier
  lookback_window: 60
  
  # Minimum absolute correlation to include an edge
  # Higher threshold = sparser graph, stronger edges
  # Lower threshold = denser graph, weaker edges included
  correlation_threshold: 0.5
  
  # Whether to create directed edges
  # false = undirected (both i->j and j->i for each edge)
  # true = directed (only i->j)
  directed: false
  
  # Minimum edges per node (advisory, for monitoring)
  # Graphs with nodes having fewer edges may indicate data issues
  min_edges_per_node: 1

# =============================================================================
# TRAINING CONFIGURATION
# =============================================================================
# Configuration for model training and validation.
# Phase 3+ will implement training loops based on these settings.
training:
  # Optimization settings
  optimizer:
    type: "adam"
    learning_rate: 0.001
    weight_decay: 0.0001
  
  # Training schedule
  schedule:
    epochs: 100
    batch_size: 32
    early_stopping_patience: 10
  
  # Loss function configuration
  loss:
    type: "placeholder"  # e.g., "sharpe", "mse", "custom"
    weights: {}
  
  # Validation settings
  validation:
    split_ratio: 0.2
    frequency: 1  # Validate every N epochs

# =============================================================================
# OPTIMIZATION CONFIGURATION
# =============================================================================
# Configuration for portfolio optimization.
# Phase 4+ will implement optimization based on these settings.
optimization:
  # Objective function
  objective:
    type: "placeholder"  # e.g., "max_sharpe", "min_variance", "risk_parity"
    risk_free_rate: 0.02
  
  # Constraints
  constraints:
    max_weight: 0.10
    min_weight: 0.0
    max_turnover: 0.20
    sector_limits: {}
  
  # Rebalancing configuration
  rebalancing:
    frequency: "monthly"
    transaction_cost: 0.001

# =============================================================================
# RUNTIME CONFIGURATION
# =============================================================================
# Configuration for experiment execution environment.
# This section is actively used in Phase 1.
runtime:
  # Random seed for reproducibility (REQUIRED for Phase 1)
  seed: 42
  
  # Device configuration
  device: "auto"  # "auto", "cpu", "cuda", "cuda:0"
  
  # Logging configuration
  logging:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    console: true
    file: false
    file_path: null  # Auto-generated if null and file: true
  
  # Experiment tracking
  tracking:
    enabled: false
    backend: "placeholder"  # e.g., "mlflow", "wandb", "tensorboard"
    project: "portfolio-gnn"
    experiment: "base"
  
  # Checkpointing
  checkpointing:
    enabled: true
    save_best: true
    save_frequency: 10  # Save every N epochs
